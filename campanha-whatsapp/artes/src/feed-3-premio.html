<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .canvas { width: 1080px; height: 1350px; padding: 90px; display: flex; flex-direction: column; }
  .brand { font-size: 40px; }
  .eyebrow { font-size: 26px; margin-top: 90px; }
  h2 { font-size: 108px; margin-top: 24px; }
  .items { margin-top: 60px; display: grid; gap: 26px; }
  .item { display: flex; align-items: center; gap: 28px; font-size: 40px; padding-bottom: 26px; border-bottom: 1px solid rgba(201,168,106,.35); }
  .item::before { content: ""; width: 14px; height: 14px; transform: rotate(45deg); background: var(--gold); flex: none; }
  .extra { margin-top: 56px; font-size: 34px; line-height: 1.45; color: var(--gold-soft); }
  .fine { margin-top: auto; }
</style></head>
<body><div class="canvas">
  <div class="brand">Scenty<small>Marketing Olfativo</small></div>
  <div class="eyebrow">O prêmio</div>
  <h2 class="serif">Kit Aromático<br><em>Scenty</em></h2>
  <div class="items">
    <div class="item">Difusor de varetas 250 ml</div>
    <div class="item">Home spray 200 ml</div>
    <div class="item">Água perfumada para tecidos</div>
    <div class="item">Sachê perfumado</div>
  </div>
  <p class="extra">E todo mundo do grupo VIP recebe um cupom exclusivo de desconto.</p>
  <p class="fine">* Itens ilustrativos. Confira a composição final no regulamento.</p>
</div></body></html>
