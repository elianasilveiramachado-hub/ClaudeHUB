<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .canvas { width: 1080px; height: 1920px; padding: 220px 90px 260px; display: flex; flex-direction: column; text-align: center; align-items: center; }
  .brand { font-size: 52px; }
  .eyebrow { font-size: 28px; margin-top: 150px; }
  h1 { font-size: 150px; margin-top: 30px; }
  p.sub { font-size: 42px; line-height: 1.45; margin-top: 50px; max-width: 820px; }
  p.sub b { color: var(--gold-soft); font-weight: 600; }
  .sticker { margin-top: auto; width: 760px; height: 170px; border: 4px dashed rgba(244,239,230,.55); border-radius: 30px; display: grid; place-items: center; font-size: 30px; color: rgba(244,239,230,.7); letter-spacing: .08em; }
  .arrow { margin-top: 30px; font-size: 30px; color: var(--gold); letter-spacing: .2em; text-transform: uppercase; }
</style></head>
<body><div class="canvas">
  <svg class="waves" viewBox="0 0 1080 1920" fill="none" stroke="#c9a86a" stroke-opacity=".25" stroke-width="2">
    <path d="M-40 1180 C 200 1100, 380 1260, 620 1160 S 980 1060, 1120 1140"/>
    <path d="M-40 1230 C 220 1150, 400 1310, 640 1210 S 1000 1110, 1120 1190"/>
    <path d="M-40 1280 C 240 1200, 420 1360, 660 1260 S 1020 1160, 1120 1240"/>
  </svg>
  <div class="brand">Scenty<small>Marketing Olfativo</small></div>
  <div class="eyebrow">Grupo VIP no WhatsApp</div>
  <h1 class="serif">Entre e<br><em>concorra</em></h1>
  <p class="sub">Um <b>Kit Aromático Scenty</b> para a resposta mais criativa, além de <b>cupons</b>, lançamentos antecipados e aviso de reposição.</p>
  <div class="sticker">COLE AQUI O STICKER DE LINK</div>
  <div class="arrow">Toque no link ↑</div>
</div></body></html>
